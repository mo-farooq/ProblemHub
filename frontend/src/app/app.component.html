<div class="min-h-screen flex flex-col bg-[#09090b] text-zinc-100 selection:bg-amber-500 selection:text-black">
  <!-- Top Navigation Header -->
  <header class="bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 sticky top-0 z-50 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Brand / Logo -->
      <div class="flex items-center gap-8">
        <a routerLink="/" class="flex items-center gap-1.5 font-extrabold text-xl tracking-tight select-none group">
          <span class="text-white tracking-tighter text-2xl font-black">Problem</span>
          <span class="bg-amber-500 text-black px-2.5 py-0.5 rounded-lg text-xl font-black tracking-tight shadow-sm shadow-amber-500/20 group-hover:bg-amber-400 transition-colors">Hub</span>
          <span class="hidden sm:inline-block text-[10px] font-mono tracking-wider font-bold uppercase text-amber-500/90 border border-amber-500/30 px-1.5 py-0.5 rounded bg-amber-500/10 ml-1">
            SPECS
          </span>
        </a>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center gap-1 text-sm font-semibold">
          <a
            routerLink="/problems"
            routerLinkActive="bg-zinc-900 text-amber-400 border border-zinc-800"
            class="px-3.5 py-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-900/60 transition-colors">
            Browse Problems
          </a>
          <a
            *ngIf="auth.isLoggedIn()"
            routerLink="/bookmarks"
            routerLinkActive="bg-zinc-900 text-amber-400 border border-zinc-800"
            class="px-3.5 py-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-900/60 transition-colors flex items-center gap-1.5">
            <svg class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"/></svg>
            Shortlist
          </a>
        </nav>
      </div>

      <!-- Right User / Auth Actions -->
      <div class="flex items-center gap-3 text-sm">
        <!-- If Logged In -->
        <ng-container *ngIf="auth.isLoggedIn(); else guestActions">
          <a
            *ngIf="auth.isAdmin()"
            routerLink="/admin"
            routerLinkActive="bg-amber-500/20 border-amber-500/60 text-amber-300"
            class="text-xs font-bold px-3 py-1.5 rounded-lg border border-amber-500/30 text-amber-400 bg-amber-500/10 hover:bg-amber-500 hover:text-black transition-all">
            Admin Console
          </a>

          <div class="flex items-center gap-3 pl-3 border-l border-zinc-800">
            <div class="text-right hidden sm:block">
              <span class="block text-xs font-bold text-white leading-tight">{{ auth.currentUser()?.name }}</span>
              <span class="block text-[10px] text-amber-500 font-mono font-bold uppercase tracking-wider">{{ auth.currentUser()?.role }}</span>
            </div>
            <button
              (click)="auth.logout()"
              class="px-3 py-1.5 text-xs text-zinc-400 hover:text-rose-400 hover:bg-zinc-900 rounded-lg transition-colors font-medium border border-transparent hover:border-zinc-800">
              Sign Out
            </button>
          </div>
        </ng-container>

        <!-- If Logged Out -->
        <ng-template #guestActions>
          <a
            routerLink="/auth/login"
            class="text-zinc-300 hover:text-white font-semibold px-3.5 py-1.5 text-xs sm:text-sm transition-colors rounded-lg hover:bg-zinc-900">
            Sign In
          </a>
          <a
            routerLink="/auth/register"
            class="bg-amber-500 hover:bg-amber-400 text-black font-black px-4 py-1.5 rounded-lg shadow-sm shadow-amber-500/20 hover:shadow-amber-500/30 transition-all text-xs sm:text-sm">
            Get Started
          </a>
        </ng-template>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Minimal Dark Footer -->
  <footer class="bg-black border-t border-zinc-900 py-8 text-center text-xs text-zinc-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-white font-black text-sm">Problem</span>
        <span class="bg-amber-500 text-black font-black text-xs px-1.5 py-0.5 rounded">Hub</span>
        <span class="text-zinc-600 ml-2">Discover · Understand · Filter · Shortlist · Build</span>
      </div>
      <div class="flex items-center gap-3 text-[11px] text-zinc-500 font-mono">
        <span class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-zinc-400">Spring Boot 3.3</span>
        <span class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-zinc-400">Spring JDBC</span>
        <span class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-zinc-400">MySQL</span>
        <span class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-zinc-400">Angular 22</span>
      </div>
    </div>
  </footer>
</div>
